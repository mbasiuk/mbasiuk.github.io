<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mykhailo Basiuk - Home Page</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 16px;
            letter-spacing: 1.6px;
            text-underline-offset: 1rem;
        }

        nav {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            padding: 0 1rem;
            gap: 1rem;
            text-transform: uppercase;
            font-weight: lighter;
        }

        nav a {
            line-height: 4rem;
            display: none;
        }

        .narrow-show {
            display: block;
        }

        .hamburger {
            display: inline-block;
            background-image: url(/img/hamburger-on.svg);
            background-repeat: no-repeat;
            width: 2rem;
            height: 2rem;
            vertical-align: middle;
        }

        .menu-on .hamburger {
            background-image: url(/img/hamburger-off.svg);
        }

        nav.menu-on {
            flex-direction: column;
            align-items: center;
        }

        nav.menu-on a {
            display: block;
            width: 100%;
            text-align: center;
        }

        .hero {
            background-image: url();
        }

        @media(min-width: 640px) {

            nav,
            nav.menu-on {
                width: 640px;
                margin: auto;
                flex-direction: row;
            }

            nav a,
            nav.menu-on a {
                display: block;
                width: initial;
                text-align: left;
            }

            .hamburger {
                display: none;
            }
        }

        @media (min-width: 1240px) {

            nav,
            nav.menu-on {
                width: 1240px;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a style="flex: auto;" class="narrow-show" href="/#">Home</a>
            <a href="/hr">For Recruters</a>
            <a href="/solutions">For Developers</a>
            <a href="/investors">For Investors</a>
            <a href="/login">Login</a>
            <a href="#" id="hamburger" class="narrow-show">
                <span class="hamburger"></span>
            </a>
        </nav>
    </header>
    <script>
        var hamburger, nav, isShown;

        function toggleMenu() {
            isShown = !isShown;
            nav.classList.toggle("menu-on", isShown);
        }

        window.addEventListener("load", function () {
            hamburger = document.getElementById("hamburger");
            nav = hamburger.parentElement;
            isShown = false;
            hamburger.addEventListener("click", toggleMenu);
        });

        window.addEventListener("keydown", function (ev) {
            ev.preventDefault();
            if (isShown) {
                toggleMenu();
            }
        });

    </script>
</body>

</html>
